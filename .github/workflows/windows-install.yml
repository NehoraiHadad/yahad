name: Windows install acceptance

# Runs the synthetic C# suites, then builds an upgrade set from the exact commit
# (installer/ci-build-upgrade-set.ps1: n, app-only n+app, an app that exits
# after migrating, an infrastructure bump n1, a broken n1 app, a contract-too-high
# manifest, a release naming another Setup and refused manifests on both tracks,
# all sharing one infrastructure cache) and
# runs real machine acceptance on a disposable Windows runner
# (installer/machine-acceptance.ps1): install, readiness, first family over
# HTTP, repair, refused releases, app-only update through the Updater with LAN
# untouched, app health rollback, Setup-track health rollback and interrupted-
# upgrade recovery, infrastructure upgrade, replay refusal, keep-data
# uninstall, reinstall with the family intact, full removal, same-infrastructure
# manual Setup, and removal of a moved install. The releases are signed by a
# key generated in this job and destroyed with it; the real signing key never
# touches CI.
on:
  push:
    branches: [main, windows-install-acceptance]
    paths:
      - 'installer/**'
      - 'scripts/**'
      - 'src/**'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-install.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: windows-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    # Synthetic, non-privileged C# suites; separate from the machine run so a
    # failure is attributed to a suite, not to installation.
    if: github.repository == 'NehoraiHadad/yahad' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_SDK_VERSION: 10.0.403
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Fetch pinned build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .local/tools, .local/downloads | Out-Null
          # The one Node pin: the same archive the release payload vendors.
          $node = (Get-Content installer/windows/dependency-pins.json -Raw | ConvertFrom-Json).node
          $zip = ".local/downloads/$($node.archive.name)"
          Invoke-WebRequest $node.archive.url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $node.archive.sha256) { throw 'Node archive checksum' }
          Expand-Archive $zip .local/tools
          $root = ($node.files | Where-Object directoryPath -eq 'node.exe').archivePath -replace '/node\.exe$', ''
          if (!(Test-Path -LiteralPath ".local/tools/$root/node.exe" -PathType Leaf)) { throw "The Node archive has no $root/node.exe" }
          "NODE_DIRECTORY=.local/tools/$root" >> $env:GITHUB_ENV
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1' -OutFile .local/downloads/dotnet-install.ps1
          & .local/downloads/dotnet-install.ps1 -Version $env:DOTNET_SDK_VERSION -InstallDir .local/tools/dotnet -NoPath
      - name: Yahad.Install.Tests
        shell: pwsh
        run: ./installer/ci-test-suites.ps1 -Suite Install -DotNet .local/tools/dotnet/dotnet.exe -Node "$env:NODE_DIRECTORY/node.exe" -PackageCache .local/nuget-cache -Output .local/suites
      - name: Yahad.FirstInstall.Tests --full-installer-only
        if: success() || failure()
        shell: pwsh
        run: ./installer/ci-test-suites.ps1 -Suite FirstInstall -DotNet .local/tools/dotnet/dotnet.exe -Node "$env:NODE_DIRECTORY/node.exe" -PackageCache .local/nuget-cache -Output .local/suites
      - name: Yahad.ServiceHost.Tests
        if: success() || failure()
        shell: pwsh
        run: ./installer/ci-test-suites.ps1 -Suite ServiceHost -DotNet .local/tools/dotnet/dotnet.exe -Node "$env:NODE_DIRECTORY/node.exe" -PackageCache .local/nuget-cache -Output .local/suites
      - name: Keep suite results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csharp-suites-${{ github.sha }}
          path: .local/suites/
          retention-days: 14
          if-no-files-found: warn
  install:
    # Standard runners are free only for public repositories; never spend minutes.
    if: github.repository == 'NehoraiHadad/yahad' && github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DOTNET_SDK_VERSION: 10.0.403
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Fetch pinned build tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force .local/tools, .local/downloads | Out-Null
          # The one Node pin: the same archive the release payload vendors.
          $node = (Get-Content installer/windows/dependency-pins.json -Raw | ConvertFrom-Json).node
          $zip = ".local/downloads/$($node.archive.name)"
          Invoke-WebRequest $node.archive.url -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $node.archive.sha256) { throw 'Node archive checksum' }
          Expand-Archive $zip .local/tools
          $root = ($node.files | Where-Object directoryPath -eq 'node.exe').archivePath -replace '/node\.exe$', ''
          if (!(Test-Path -LiteralPath ".local/tools/$root/node.exe" -PathType Leaf)) { throw "The Node archive has no $root/node.exe" }
          "NODE_DIRECTORY=.local/tools/$root" >> $env:GITHUB_ENV
          Invoke-WebRequest 'https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1' -OutFile .local/downloads/dotnet-install.ps1
          & .local/downloads/dotnet-install.ps1 -Version $env:DOTNET_SDK_VERSION -InstallDir .local/tools/dotnet -NoPath
      - name: Fetch pinned vendors
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pins = Get-Content installer/windows/dependency-pins.json -Raw | ConvertFrom-Json
          $d = '.local/downloads'
          $source = $pins.sources.caddy
          Invoke-WebRequest $source.archive.url -OutFile "$d/caddy-archive"
          Invoke-WebRequest $source.checksums.url -OutFile "$d/caddy-checksums"
          python -m installer.windows.dependencies stage --caddy-archive "$d/caddy-archive" --caddy-checksums "$d/caddy-checksums" --output .local/vendors
          if ($LASTEXITCODE -ne 0) { throw 'Vendor staging failed' }
      - name: Install locked npm dependencies
        shell: pwsh
        run: |
          $node = $env:NODE_DIRECTORY
          & "$node/node.exe" "$node/node_modules/npm/bin/npm-cli.js" ci --cache .local/npm-cache --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
      - name: Generate an ephemeral release key
        shell: pwsh
        run: |
          & "$env:NODE_DIRECTORY/node.exe" scripts/windows-release-key.mjs keygen "$env:RUNNER_TEMP/release-key"
          if ($LASTEXITCODE -ne 0) { throw 'Key generation failed' }
      - name: Build the upgrade set (n, app, unhealthy, n1, broken, contract, mismatch, refused)
        shell: pwsh
        run: ./installer/ci-build-upgrade-set.ps1 -Key "$env:RUNNER_TEMP/release-key" -NodeDirectory "$env:NODE_DIRECTORY" -NpmCache .local/npm-cache -VendorDirectory .local/vendors -DotNet .local/tools/dotnet/dotnet.exe -PackageCache .local/nuget-cache -InfraCache .local/packages/infra-cache -Output .local/packages/set
      - name: Machine acceptance (install, app update, rollbacks, infrastructure upgrade, reinstall, removal)
        shell: pwsh
        run: ./installer/machine-acceptance.ps1 -Set .local/packages/set -Output .local/acceptance -Disposable
      - name: Destroy the ephemeral release key
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath "$env:RUNNER_TEMP/release-key" -Recurse -Force -ErrorAction SilentlyContinue
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-acceptance-${{ github.sha }}
          path: |
            .local/acceptance/
            .local/packages/set/upgrade-set.json
            .local/packages/set/*/*.log
            .local/packages/set/*/package-build.json
            .local/packages/infra-cache/*/*.log
            .local/packages/infra-cache/*/*.json
          retention-days: 14
          if-no-files-found: warn
